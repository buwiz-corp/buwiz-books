[package]
name = "books-mini-app"
version = "0.1.0"
description = "Buwiz Books mini app for the Buwiz Bot: the stdio MCP server for plugin app.buwiz.books"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "books-mini-app"
path = "src/main.rs"

# The workspace-level tests (docs/05 §P0 lists `tests/`).
[[test]]
name = "jcs_vectors"
path = "../../tests/jcs_vectors.rs"

[[test]]
name = "manifest_shape"
path = "../../tests/manifest_shape.rs"

[[test]]
name = "stdio_roundtrip"
path = "../../tests/stdio_roundtrip.rs"

[[test]]
name = "ledger_tools"
path = "../../tests/ledger_tools.rs"

[[test]]
name = "golden_reports"
path = "../../tests/golden_reports.rs"

[[test]]
name = "months_reconcile"
path = "../../tests/months_reconcile.rs"

[[test]]
name = "cloud_link"
path = "../../tests/cloud_link.rs"

[[test]]
name = "chat_cards"
path = "../../tests/chat_cards.rs"

[[test]]
name = "handoff_slice_b"
path = "../../tests/handoff_slice_b.rs"

[[test]]
name = "forms_bridge"
path = "../../tests/forms_bridge.rs"

[[test]]
name = "privacy_outputs"
path = "../../tests/privacy_outputs.rs"

[dependencies]
books-core = { path = "../books-core" }
books-store = { path = "../books-store" }
# Session certificates are signed with the ed25519 key the Bot provisions (spec 4.4).
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
# Tickets: 130 bits from the OS CSPRNG (spec 9.5).
getrandom = "0.3"
# Manifest hash, permissions digest and app fingerprints (spec 4.4, 5.2, 6.2).
sha2 = "0.10"
serde_json = "1"
# M9: device sign-in to buwiz-cloud and the tax-profile list, over TLS
# (rustls); used only when BOOKS_CLOUD_URL is set.
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[lints]
workspace = true
